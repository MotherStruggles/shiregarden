<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — Shire Garden</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #2c2c2c;
            background: #faf7f2;
            line-height: 1.7;
            min-height: 100vh;
        }

        .reader-header {
            background: linear-gradient(180deg, rgba(252, 228, 184, 0.3), rgba(245, 196, 138, 0.1));
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .reader-header a {
            color: #6a5a4a;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .reader-header a:hover { color: #4a7a5a; }

        .reader-header h2 {
            font-size: 1.1rem;
            color: #3d2b1a;
            font-weight: 400;
        }

        .reader-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .reader-controls button {
            background: #d4c4a0;
            border: 1px solid #b8986a;
            color: #3d2b1a;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .reader-controls button:hover {
            background: #c4a87a;
        }

        .reader-controls button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-num {
            font-size: 0.9rem;
            color: #6a5a4a;
            min-width: 80px;
            text-align: center;
        }

        /* ── Book Container ── */
        .book-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            justify-content: center;
        }

        .book {
            width: 100%;
            max-width: 800px;
            background: #f5f0e8;
            border-radius: 4px;
            box-shadow:
                0 4px 20px rgba(0,0,0,0.1),
                inset 0 0 0 1px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }

        /* Page spread - two pages side by side */
        .page-spread {
            display: flex;
            min-height: 70vh;
        }

        .page {
            flex: 1;
            padding: 3rem 2.5rem;
            background: #faf7f0;
            background-image:
                radial-gradient(ellipse at 0% 50%, rgba(0,0,0,0.02) 0%, transparent 50%);
            position: relative;
            overflow-y: auto;
            max-height: 80vh;
        }

        .page:first-child {
            border-right: 1px solid #e0d8cc;
            background-image:
                radial-gradient(ellipse at 100% 50%, rgba(0,0,0,0.02) 0%, transparent 50%);
        }

        .page p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #3d2b1a;
            margin-bottom: 0.8rem;
            text-indent: 1.5rem;
        }

        .page p:first-of-type {
            text-indent: 0;
        }

        .page h2 {
            font-size: 1.3rem;
            color: #3d2b1a;
            font-weight: 400;
            text-align: center;
            margin: 1.5rem 0 1rem;
            font-variant: small-caps;
            letter-spacing: 2px;
        }

        .page h1 {
            font-size: 1.6rem;
            color: #2a1a0a;
            font-weight: 400;
            text-align: center;
            margin: 2rem 0 1rem;
        }

        .page .chapter-label {
            text-align: center;
            font-size: 0.9rem;
            color: #8a7a6a;
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        /* ── Page curl animation ── */
        .page-turning {
            animation: pageTurn 0.4s ease-in-out;
        }

        @keyframes pageTurn {
            0% { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
            50% { transform: perspective(1000px) rotateY(-15deg); opacity: 0.7; }
            100% { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
        }

        /* ── Empty state ── */
        .empty-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            color: #8a7a6a;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .page-spread { flex-direction: column; }
            .page:first-child { border-right: none; border-bottom: 1px solid #e0d8cc; }
            .page { padding: 2rem 1.5rem; max-height: none; }
            .reader-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="reader-header">
        <a href="reading-room.html">← Reading Room</a>
        <h2 id="book-title">Loading...</h2>
        <div class="reader-controls">
            <button id="prev-btn" disabled>◀ Prev</button>
            <span class="page-num" id="page-num">Page 1</span>
            <button id="next-btn">Next ▶</button>
        </div>
    </div>

    <div class="book-container">
        <div class="book" id="book">
            <div class="page-spread" id="spread">
                <div class="page" id="left-page">
                    <div class="empty-page">Loading...</div>
                </div>
                <div class="page" id="right-page">
                    <div class="empty-page">✦</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── Book Data ──
        const books = {
            'velveteen-rabbit': { title: 'The Velveteen Rabbit', author: 'Margery Williams' },
            'wind-in-the-willows': { title: 'The Wind in the Willows', author: 'Kenneth Grahame' },
            'alice-in-wonderland': { title: "Alice's Adventures in Wonderland", author: 'Lewis Carroll' },
            'little-prince': { title: 'The Little Prince', author: 'Antoine de Saint-Exupéry' }
        };

        // ── State ──
        let currentPage = 0;
        let pages = [];
        const linesPerPage = 28;

        // ── Get book ──
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('book') || 'velveteen-rabbit';
        const book = books[bookId] || books['velveteen-rabbit'];

        document.getElementById('book-title').textContent = `${book.title} — ${book.author}`;
        document.title = `${book.title} — Shire Garden`;

        // ── Load text ──
        async function loadBook() {
            try {
                const resp = await fetch(`books/${bookId}.txt`);
                const text = await resp.text();
                paginate(text);
            } catch(e) {
                document.getElementById('left-page').innerHTML = `<div class="empty-page">Could not load "${book.title}". The text may not be available yet.</div>`;
            }
        }

        // ── Paginate ──
        function paginate(text) {
            // Strip Gutenberg header/footer
            let content = text;
            const startMarker = '*** START OF';
            const endMarker = '*** END OF';
            const startIdx = content.indexOf(startMarker);
            const endIdx = content.indexOf(endMarker);

            if (startIdx !== -1) {
                const lineStart = content.indexOf('\n', startIdx);
                content = content.slice(lineStart + 1);
            }
            if (endIdx !== -1) {
                content = content.slice(0, endIdx);
            }

            // Split into paragraphs
            const paragraphs = content.split(/\n\n+/).filter(p => p.trim());

            // Build pages
            pages = [];
            let currentLines = [];
            let lineCount = 0;

            for (const para of paragraphs) {
                const lines = para.split('\n').filter(l => l.trim());
                const paraLines = lines.length;

                if (lineCount + paraLines > linesPerPage && currentLines.length > 0) {
                    pages.push(currentLines.join('\n\n'));
                    currentLines = [];
                    lineCount = 0;
                }

                currentLines.push(para);
                lineCount += paraLines;
            }

            if (currentLines.length > 0) {
                pages.push(currentLines.join('\n\n'));
            }

            if (pages.length === 0) pages = ['(No content)'];

            renderSpread();
        }

        // ── Render ──
        function renderSpread() {
            const leftEl = document.getElementById('left-page');
            const rightEl = document.getElementById('right-page');

            const leftIdx = currentPage;
            const rightIdx = currentPage + 1;

            leftEl.innerHTML = formatPage(pages[leftIdx], leftIdx);
            rightEl.innerHTML = rightIdx < pages.length ? formatPage(pages[rightIdx], rightIdx) :
                `<div class="empty-page">✦ The End ✦<br><br><a href="reading-room.html" style="color: #4a7a5a;">Return to the Reading Room</a></div>`;

            // Update controls
            document.getElementById('prev-btn').disabled = currentPage <= 0;
            document.getElementById('next-btn').disabled = currentPage >= pages.length - 2;
            document.getElementById('page-num').textContent = `Page ${leftIdx + 1} of ${pages.length}`;

            // Scroll to top
            leftEl.scrollTop = 0;
            rightEl.scrollTop = 0;
        }

        function formatPage(text, idx) {
            if (!text) return '<div class="empty-page">✦</div>';

            const lines = text.split('\n').filter(l => l.trim());
            let html = '';

            // Check if first line looks like a chapter heading
            const firstLine = lines[0] || '';
            const isChapter = /^(chapter|chapter\s+\d+|the\s+|i\s+|ii\s+|iii\s+)/i.test(firstLine) && firstLine.length < 60;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const nextLine = lines[i + 1] || '';
                const isNextChapter = /^(chapter|chapter\s+\d+|the\s+|i\s+|ii\s+|iii\s+)/i.test(nextLine) && nextLine.length < 60;

                if (i === 0 && isChapter) {
                    html += `<h2>${line}</h2>`;
                } else if (line === line.toUpperCase() && line.length > 3 && line.length < 60) {
                    html += `<h2>${line}</h2>`;
                } else if (line.startsWith('*') && line.endsWith('*')) {
                    html += `<p style="text-align:center;font-style:italic;">${line.slice(1, -1)}</p>`;
                } else if (line.startsWith('[') && line.endsWith(']')) {
                    html += `<p style="text-align:center;font-size:0.9rem;color:#8a7a6a;">${line.slice(1, -1)}</p>`;
                } else {
                    html += `<p>${line}</p>`;
                }

                if (isNextChapter) {
                    html += `<div style="height:2rem;"></div>`;
                }
            }

            return html;
        }

        // ── Navigation ──
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage -= 2;
                if (currentPage < 0) currentPage = 0;
                renderSpread();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentPage < pages.length - 2) {
                currentPage += 2;
                renderSpread();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                document.getElementById('next-btn').click();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                document.getElementById('prev-btn').click();
            }
        });

        // ── Start ──
        loadBook();
    </script>
</body>
</html>
