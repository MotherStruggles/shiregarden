<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll — Shire Garden</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #2c2c2c;
            background: #3d2b1a;
            line-height: 1.7;
            min-height: 100vh;
        }

        .scroll-header {
            background: linear-gradient(180deg, #2a1a0a, #3d2b1a);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 2px solid #6b4f2e;
        }

        .scroll-header a {
            color: #c4a87a;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .scroll-header a:hover { color: #e8dcc8; }

        .scroll-header h2 {
            font-size: 1.1rem;
            color: #d4c4a0;
            font-weight: 400;
        }

        /* ── Scroll Container ── */
        .scroll-wrapper {
            max-width: 750px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
        }

        /* Top and bottom scroll rods */
        .scroll-wrapper::before,
        .scroll-wrapper::after {
            content: '';
            display: block;
            height: 24px;
            margin: 0 auto;
            background: linear-gradient(180deg, #8b6f47, #6b4f2e, #8b6f47);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 90%;
        }

        .scroll-wrapper::after {
            margin-top: 0;
        }

        .scroll-parchment {
            background: #f5f0e0;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(139, 111, 71, 0.03) 2px,
                    rgba(139, 111, 71, 0.03) 4px
                ),
                radial-gradient(ellipse at 50% 0%, rgba(212, 196, 160, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(212, 196, 160, 0.3) 0%, transparent 60%);
            padding: 3rem 3.5rem;
            min-height: 50vh;
            box-shadow:
                inset 0 0 40px rgba(139, 111, 71, 0.08),
                0 4px 20px rgba(0,0,0,0.15);
            position: relative;
        }

        /* Torn/rough edge effect */
        .scroll-parchment::before,
        .scroll-parchment::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 8px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #f5f0e0 0px,
                    #f5f0e0 3px,
                    transparent 3px,
                    transparent 5px,
                    #f5f0e0 5px,
                    #f5f0e0 8px,
                    transparent 8px,
                    transparent 10px
                );
        }
        .scroll-parchment::before { top: -4px; }
        .scroll-parchment::after { bottom: -4px; }

        .scroll-parchment h1 {
            font-size: 1.8rem;
            color: #2a1a0a;
            text-align: center;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .scroll-parchment .scroll-author {
            text-align: center;
            font-style: italic;
            color: #6a5a4a;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .scroll-parchment .scroll-divider {
            text-align: center;
            color: #c4a87a;
            font-size: 1.5rem;
            margin: 1.5rem 0;
            letter-spacing: 8px;
        }

        .scroll-parchment p {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #3d2b1a;
            margin-bottom: 0.8rem;
            text-indent: 1.5rem;
        }

        .scroll-parchment p:first-of-type {
            text-indent: 0;
        }

        .scroll-parchment h2 {
            font-size: 1.3rem;
            color: #3d2b1a;
            font-weight: 400;
            text-align: center;
            margin: 2rem 0 1rem;
            font-variant: small-caps;
            letter-spacing: 3px;
        }

        .scroll-parchment .scroll-end {
            text-align: center;
            font-size: 1.2rem;
            color: #8a7a6a;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #d4c4a0;
        }

        .scroll-parchment .scroll-end a {
            color: #4a7a5a;
            text-decoration: none;
        }
        .scroll-parchment .scroll-end a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .scroll-parchment { padding: 2rem 1.5rem; }
            .scroll-wrapper { padding: 2rem 1rem; }
            .scroll-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="scroll-header">
        <a href="reading-room.html">← Reading Room</a>
        <h2 id="scroll-title">Loading...</h2>
        <div></div>
    </div>

    <div class="scroll-wrapper">
        <div class="scroll-parchment" id="scroll-content">
            <div style="text-align:center;padding:4rem 0;color:#8a7a6a;">Unfurling the scroll...</div>
        </div>
    </div>

    <script>
        const scrolls = {
            'poems': { title: 'Poetry Collection', author: 'Various Poets' },
            'mesnevi-rumi': { title: 'The Mesnevi', author: 'Jalal al-Din Rumi' },
            'festival-of-spring-rumi': { title: 'The Festival of Spring', author: 'Jalal al-Din Rumi' }
        };

        const params = new URLSearchParams(window.location.search);
        const scrollId = params.get('book') || 'poems';
        const scroll = scrolls[scrollId] || scrolls['poems'];

        document.getElementById('scroll-title').textContent = `${scroll.title} — ${scroll.author}`;
        document.title = `${scroll.title} — Shire Garden`;

        async function loadScroll() {
            try {
                const resp = await fetch(`books/${scrollId}.txt`);
                const text = await resp.text();
                renderScroll(text);
            } catch(e) {
                document.getElementById('scroll-content').innerHTML = `
                    <h1>${scroll.title}</h1>
                    <p class="scroll-author">${scroll.author}</p>
                    <p style="text-align:center;color:#8a7a6a;">Could not load this scroll. The text may not be available yet.</p>
                `;
            }
        }

        function renderScroll(text) {
            // Strip Gutenberg header/footer
            let content = text;
            const startMarker = '*** START OF';
            const endMarker = '*** END OF';
            const startIdx = content.indexOf(startMarker);
            const endIdx = content.indexOf(endMarker);

            if (startIdx !== -1) {
                const lineStart = content.indexOf('\n', startIdx);
                content = content.slice(lineStart + 1);
            }
            if (endIdx !== -1) {
                content = content.slice(0, endIdx);
            }

            const lines = content.split('\n').filter(l => l.trim());
            let html = `<h1>${scroll.title}</h1>
                        <p class="scroll-author">${scroll.author}</p>
                        <div class="scroll-divider">✦ ✦ ✦</div>`;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const nextLine = lines[i + 1] || '';

                if (line === line.toUpperCase() && line.length > 3 && line.length < 60) {
                    html += `<h2>${line}</h2>`;
                } else if (line.startsWith('*') && line.endsWith('*')) {
                    html += `<p style="text-align:center;font-style:italic;">${line.slice(1, -1)}</p>`;
                } else if (line.startsWith('[') && line.endsWith(']')) {
                    // Skip Gutenberg metadata markers
                    continue;
                } else if (/^CHAPTER\s+\d+/i.test(line)) {
                    html += `<h2>${line}</h2>`;
                } else {
                    html += `<p>${line}</p>`;
                }
            }

            html += `<div class="scroll-end">✦<br><br><a href="reading-room.html">Return to the Reading Room</a></div>`;
            document.getElementById('scroll-content').innerHTML = html;
        }

        loadScroll();
    </script>
</body>
</html>
